sonar.projectKey=hipstagram-core
sonar.projectName=Hipstagram
sonar.projectVersion=1.0
sonar.organization=kazc93

sonar.sources=backend
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/dist/**,**/uploads/**,**/.git/**,**/coverage/**

# Excluir de duplicados: archivos de infraestructura repetidos intencionalmente en microservicios
# authMiddleware.ts es idéntico en post-service e interactions-service por diseño (microservicios)
sonar.cpd.exclusions=\
  **/config/db.ts,\
  **/src/db.ts,\
  **/authMiddleware.ts,\
  **/src/index.ts,\
  **/indexBackup.ts

# Solo medir cobertura en los archivos que tienen tests unitarios reales
# Se excluyen: infraestructura, boilerplate, handlers de rutas, servicios sin tests
sonar.coverage.exclusions=\
  **/config/db.ts,\
  **/src/db.ts,\
  **/src/index.ts,\
  **/indexBackup.ts,\
  **/routes/**,\
  **/services/**,\
  **/interfaces/**,\
  backend/audit-service/src/**,\
  backend/user-service/src/**,\
  backend/search-service/src/**,\
  backend/media-service/src/**,\
  backend/moderation-service/src/**,\
  backend/api-gateway/src/**

sonar.javascript.node.maxspace=1536

# Cobertura generada por Jest en los 3 servicios con tests
sonar.javascript.lcov.reportPaths=\
  backend/auth-service/coverage/lcov.info,\
  backend/post-service/coverage/lcov.info,\
  backend/interactions-service/coverage/lcov.info
