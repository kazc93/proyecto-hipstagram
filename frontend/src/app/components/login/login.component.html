<div class="min-h-screen flex flex-col items-center justify-center bg-linear-to-br from-hipstagram-lighter to-hipstagram-light relative overflow-hidden">

  <div class="absolute bottom-0 left-0 right-0 h-1/2 bg-hipstagram-primary origin-bottom-left skew-y-3 transform z-0 opacity-20"></div>

  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-10 w-full max-w-md z-10 mx-4">
    <h2 class="text-3xl sm:text-4xl font-extrabold text-center text-hipstagram-dark mb-6 sm:mb-8">Bienvenido A Hipstagram</h2>

    <!-- ── Formulario de login ── -->
    <div *ngIf="!mostrarReset">

      <div *ngIf="mensajeError" class="bg-red-100 text-red-600 p-3 rounded-lg text-sm mb-4 text-center">
        {{ mensajeError }}
      </div>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm" class="space-y-6">

        <div>
          <label class="block text-sm font-semibold text-hipstagram-dark mb-2">Correo o usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">👤</span>
            <input
              type="text"
              name="identifier"
              [(ngModel)]="credenciales.identifier"
              required
              placeholder="Correo o nombre de usuario"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-hipstagram-secondary focus:border-transparent transition-all"
            >
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-hipstagram-dark mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔒</span>
            <input
              type="password"
              name="password"
              [(ngModel)]="credenciales.password"
              required
              placeholder="Ingresa contraseña"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-hipstagram-secondary focus:border-transparent transition-all"
            >
          </div>
          <div class="text-right mt-1">
            <button
              type="button"
              (click)="toggleReset()"
              class="text-sm font-medium text-hipstagram-primary hover:text-hipstagram-dark">
              ¿Olvidaste tu contraseña?
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="!loginForm.valid"
          class="w-full py-3 mt-4 bg-hipstagram-primary hover:bg-hipstagram-dark text-white font-bold rounded-lg shadow-md transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          Iniciar Sesión
        </button>

      </form>

      <div class="mt-8 text-center text-sm text-gray-500">
        ¿No tienes una cuenta?
        <a routerLink="/register" class="text-hipstagram-primary font-bold hover:underline cursor-pointer">
          Regístrate
        </a>
      </div>

    </div>

    <!-- ── Panel de reset de contraseña ── -->
    <div *ngIf="mostrarReset">

      <button
        type="button"
        (click)="toggleReset()"
        class="flex items-center gap-1 text-sm text-gray-500 hover:text-hipstagram-dark mb-5">
        ← Volver al inicio de sesión
      </button>

      <h3 class="text-xl font-bold text-hipstagram-dark mb-1">Restablecer contraseña</h3>
      <p class="text-sm text-gray-500 mb-5">Ingresa tu correo y nombre de usuario para verificar tu identidad.</p>

      <div *ngIf="mensajeReset" class="bg-green-100 text-green-700 p-3 rounded-lg text-sm mb-4 text-center">
        {{ mensajeReset }}
      </div>
      <div *ngIf="errorReset" class="bg-red-100 text-red-600 p-3 rounded-lg text-sm mb-4 text-center">
        {{ errorReset }}
      </div>

      <form (ngSubmit)="resetearPassword()" #resetForm="ngForm" class="space-y-4">

        <div>
          <label class="block text-sm font-semibold text-hipstagram-dark mb-2">Correo electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">✉️</span>
            <input
              type="email"
              name="resetEmail"
              [(ngModel)]="resetCredenciales.email"
              required
              placeholder="Ingresa tu correo"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-hipstagram-secondary focus:border-transparent transition-all"
            >
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-hipstagram-dark mb-2">Nombre de usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">👤</span>
            <input
              type="text"
              name="resetUsername"
              [(ngModel)]="resetCredenciales.username"
              required
              placeholder="Ingresa tu usuario"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-hipstagram-secondary focus:border-transparent transition-all"
            >
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-hipstagram-dark mb-2">Nueva contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔒</span>
            <input
              type="password"
              name="nuevaPassword"
              [(ngModel)]="resetCredenciales.nuevaPassword"
              required
              minlength="6"
              placeholder="Mínimo 6 caracteres"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-hipstagram-secondary focus:border-transparent transition-all"
            >
          </div>
        </div>

        <button
          type="submit"
          [disabled]="!resetForm.valid || resetando"
          class="w-full py-3 mt-2 bg-hipstagram-primary hover:bg-hipstagram-dark text-white font-bold rounded-lg shadow-md transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ resetando ? 'Actualizando...' : 'Actualizar contraseña' }}
        </button>

      </form>
    </div>

  </div>
</div>
