<div class="auth-shell">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="auth-logo-hip">Hip</span><span class="auth-logo-sta">sta</span><span class="auth-logo-gram">gram</span>
    </div>

    <!-- LOGIN -->
    <div *ngIf="!mostrarReset">
      <h2 class="auth-title">Bienvenido</h2>
      <p class="auth-subtitle">Inicia sesión para continuar</p>

      <div *ngIf="mensajeError" class="auth-error">{{ mensajeError }}</div>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm" class="auth-form">

        <div class="auth-field">
          <label class="auth-label">Correo o usuario</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">👤</span>
            <input type="text" name="identifier" [(ngModel)]="credenciales.identifier"
                   required placeholder="Correo o nombre de usuario" class="auth-input">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label">Contraseña</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">🔒</span>
            <input type="password" name="password" [(ngModel)]="credenciales.password"
                   required placeholder="Ingresa tu contraseña" class="auth-input">
          </div>
          <div class="auth-forgot">
            <button type="button" (click)="toggleReset()" class="auth-link">¿Olvidaste tu contraseña?</button>
          </div>
        </div>

        <button type="submit" [disabled]="!loginForm.valid" class="auth-btn">Iniciar Sesión</button>

      </form>

      <p class="auth-switch">¿No tienes una cuenta? <a routerLink="/register" class="auth-link">Regístrate</a></p>
    </div>

    <!-- RESET -->
    <div *ngIf="mostrarReset">
      <button type="button" (click)="toggleReset()" class="auth-back">← Volver al inicio de sesión</button>
      <h2 class="auth-title">Restablecer contraseña</h2>
      <p class="auth-subtitle">Verifica tu identidad para continuar.</p>

      <div *ngIf="mensajeReset" class="auth-success">{{ mensajeReset }}</div>
      <div *ngIf="errorReset"   class="auth-error">{{ errorReset }}</div>

      <form (ngSubmit)="resetearPassword()" #resetForm="ngForm" class="auth-form">

        <div class="auth-field">
          <label class="auth-label">Correo electrónico</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">✉️</span>
            <input type="email" name="resetEmail" [(ngModel)]="resetCredenciales.email"
                   required placeholder="Ingresa tu correo" class="auth-input">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label">Nombre de usuario</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">👤</span>
            <input type="text" name="resetUsername" [(ngModel)]="resetCredenciales.username"
                   required placeholder="Ingresa tu usuario" class="auth-input">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label">Nueva contraseña</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">🔒</span>
            <input type="password" name="nuevaPassword" [(ngModel)]="resetCredenciales.nuevaPassword"
                   required minlength="6" placeholder="Mínimo 6 caracteres" class="auth-input">
          </div>
        </div>

        <button type="submit" [disabled]="!resetForm.valid || resetando" class="auth-btn">
          {{ resetando ? 'Actualizando...' : 'Actualizar contraseña' }}
        </button>

      </form>
    </div>

  </div>
</div>
