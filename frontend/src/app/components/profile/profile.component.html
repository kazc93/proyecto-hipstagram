<div class="profile-shell">

  <!-- Header -->
  <header class="profile-header-bar">
    <button (click)="volverAlFeed()" class="profile-back">← Feed</button>
    <span class="profile-header-title">Perfil</span>
    <span></span>
  </header>

  <div class="profile-body">

    <!-- Info usuario -->
    <div class="profile-info">
      <div class="profile-avatar">{{ username ? username.charAt(0).toUpperCase() : '?' }}</div>
      <div class="profile-details">
        <h2 class="profile-username">{{ username || 'Usuario' }}</h2>
        <div class="profile-stats">
          <div class="profile-stat">
            <span class="profile-stat-num">{{ totalPosts }}</span>
            <span class="profile-stat-label">publicaciones</span>
          </div>
          <div class="profile-stat">
            <span class="profile-stat-num">{{ totalLikes }}</span>
            <span class="profile-stat-label">likes totales</span>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-divider"></div>

    <!-- Grid de posts -->
    <div *ngIf="!loading; else loadingTpl" class="profile-grid">
      <div *ngFor="let post of posts" class="profile-grid-item">
        <img [src]="post.url_imagen" [alt]="post.descripcion">
        <div class="profile-grid-overlay">
          <span>❤️ {{ post.likes || 0 }}</span>
          <span>💬 {{ post.total_comentarios || 0 }}</span>
        </div>
      </div>
    </div>

    <div *ngIf="posts.length === 0 && !loading" class="profile-empty">
      <span>📭</span>
      <p>Aún no tienes publicaciones aprobadas.</p>
    </div>

    <ng-template #loadingTpl>
      <div class="profile-loading">Cargando galería...</div>
    </ng-template>

  </div>
</div>
