<div class="auth-shell">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="auth-logo-hip">Hip</span><span class="auth-logo-sta">sta</span><span class="auth-logo-gram">gram</span>
    </div>

    <h2 class="auth-title">Crear Cuenta</h2>
    <p class="auth-subtitle">Únete a la comunidad</p>

    <div *ngIf="mensajeError"  class="auth-error">{{ mensajeError }}</div>
    <div *ngIf="mensajeExito" class="auth-success">{{ mensajeExito }}</div>

    <form (ngSubmit)="registrarUsuario()" #registerForm="ngForm" class="auth-form">

      <div class="auth-field">
        <label class="auth-label">Nombre de usuario</label>
        <div class="auth-input-wrap">
          <span class="auth-icon">👤</span>
          <input type="text" name="username" [(ngModel)]="nuevoUsuario.username"
                 required placeholder="Ej. cool_dev_99" class="auth-input">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label">Correo electrónico</label>
        <div class="auth-input-wrap">
          <span class="auth-icon">✉️</span>
          <input type="email" name="email" [(ngModel)]="nuevoUsuario.email"
                 required placeholder="Ingresa tu correo" class="auth-input">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label">Contraseña</label>
        <div class="auth-input-wrap">
          <span class="auth-icon">🔒</span>
          <input type="password" name="password" [(ngModel)]="nuevoUsuario.password"
                 required minlength="6" placeholder="Mínimo 6 caracteres" class="auth-input">
        </div>
      </div>

      <button type="submit" [disabled]="!registerForm.valid" class="auth-btn">Registrarse</button>

    </form>

    <p class="auth-switch">¿Ya tienes una cuenta? <a routerLink="/login" class="auth-link">Inicia sesión</a></p>

  </div>
</div>
